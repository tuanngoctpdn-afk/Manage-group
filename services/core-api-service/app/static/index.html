<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module Quản Lý Vườn Mít & Bản Đồ Dịch Tễ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-emerald-50 text-slate-800 min-h-screen p-6">
  <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-md p-6 border border-emerald-200">
    <div class="flex items-center justify-between border-b pb-4 mb-6">
      <div class="flex items-center space-x-3">
        <span class="text-3xl">🗺️</span>
        <div>
          <h1 class="text-2xl font-bold text-emerald-800">Module Quản Lý Vườn & Dịch Tễ - Standalone UI</h1>
          <p class="text-xs text-slate-500">Chạy độc lập tại cổng 8003 • Phục vụ Task 7.1 & 7.2</p>
        </div>
      </div>
      <span class="px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full text-xs font-semibold">Postgres Connected</span>
    </div>

    <!-- Tình hình dịch bệnh theo vùng -->
    <div class="mb-6">
      <h3 class="font-bold text-slate-700 mb-3 text-lg">1. Cảnh Báo Dịch Bệnh Vùng (Task 7.1)</h3>
      <div id="outbreakCards" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- JS load cards -->
      </div>
    </div>

    <!-- Danh sách vườn mít nông hộ -->
    <div>
      <h3 class="font-bold text-slate-700 mb-3 text-lg">2. Danh Sách Nông Hộ Trồng Mít (Task 7.2)</h3>
      <div class="overflow-x-auto border rounded-lg">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-100 text-slate-600 border-b">
            <tr>
              <th class="p-3">Mã Vườn</th>
              <th class="p-3">Chủ Hộ</th>
              <th class="p-3">Địa Bàn</th>
              <th class="p-3">Diện Tích</th>
              <th class="p-3">Giống Mít</th>
              <th class="p-3">Trạng Thái IoT</th>
            </tr>
          </thead>
          <tbody id="orchardTableBody" class="divide-y">
            <!-- JS load rows -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    async function loadData() {
      try {
        const [resMap, resOrchards] = await Promise.all([
          fetch('/api/v1/outbreak-map'),
          fetch('/api/v1/orchards')
        ]);
        const mapData = await resMap.json();
        const orchards = await resOrchards.json();

        // Render outbreak cards
        const cardsHtml = mapData.map(item => `
          <div class="p-4 rounded-lg border ${item.risk_level === 'Outbreak' ? 'bg-red-50 border-red-300' : item.risk_level === 'Warning' ? 'bg-amber-50 border-amber-300' : 'bg-emerald-50 border-emerald-300'}">
            <div class="flex justify-between items-center mb-1">
              <span class="font-bold text-sm text-slate-800">${item.region_name}</span>
              <span class="text-xs px-2 py-0.5 rounded font-bold ${item.risk_level === 'Outbreak' ? 'bg-red-500 text-white' : item.risk_level === 'Warning' ? 'bg-amber-500 text-white' : 'bg-emerald-600 text-white'}">${item.risk_level}</span>
            </div>
            <p class="text-xs text-slate-600 mt-2">Nhiễm bệnh: <b>${item.infected_orchards}/${item.total_orchards}</b></p>
            <p class="text-xs text-red-700 font-semibold mt-1">Dịch chủ đạo: ${item.dominant_disease}</p>
          </div>
        `).join('');
        document.getElementById('outbreakCards').innerHTML = cardsHtml;

        // Render orchard table
        const tableHtml = orchards.map(o => `
          <tr class="hover:bg-slate-50">
            <td class="p-3 font-semibold text-emerald-700">${o.id}</td>
            <td class="p-3 font-medium">${o.owner_name}</td>
            <td class="p-3 text-slate-600">${o.district}, ${o.province}</td>
            <td class="p-3">${o.area_hectares} ha</td>
            <td class="p-3 text-slate-600">${o.jackfruit_variety}</td>
            <td class="p-3">
              ${o.iot_connected ? '<span class="text-emerald-600 font-semibold">● Đã kết nối</span>' : '<span class="text-slate-400">○ Chưa lắp</span>'}
            </td>
          </tr>
        `).join('');
        document.getElementById('orchardTableBody').innerHTML = tableHtml;

      } catch (err) {
        console.error("Lỗi tải dữ liệu core-api:", err);
      }
    }

    loadData();
  </script>
</body>
</html>
